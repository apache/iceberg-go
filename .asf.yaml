github:
  description: "Apache Iceberg - Go"
  homepage: https://go.iceberg.apache.org/
  labels:
    - iceberg
    - apache
    - golang
  features:
    issues: true

  enabled_merge_buttons:
    squash: true
    squash_commit_message: PR_TITLE_AND_COMMIT_DETAILS
    merge: false
    rebase: false

  ghp_branch: gh-pages
  ghp_path: /

  protected_branches:
    main:
      required_status_checks:
        contexts:
          - Analyze Actions
          - Run zizmor 🌈
          - asf-allowlist-check
          - rat
          - Audit and Verify
          - go-ci-required
          - go-integration-required

      required_pull_request_reviews:
        required_approving_review_count: 1

      required_linear_history: true

  rulesets:
    - name: Merge Queue
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - "~DEFAULT_BRANCH"
          exclude: []
      rules:
        - type: merge_queue
          parameters:
            check_response_timeout_minutes: 90
            grouping_strategy: ALLGREEN
            max_entries_to_build: 1
            max_entries_to_merge: 1
            merge_method: SQUASH
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 0

  pull_requests:
    # auto-delete head branches after being merged
    del_branch_on_merge: true

notifications:
  commits:      commits@iceberg.apache.org
  issues:       issues@iceberg.apache.org
  pullrequests: issues@iceberg.apache.org
  jobs:         ci-jobs@iceberg.apache.org
