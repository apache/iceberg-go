---
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - intrange
    - copyloopvar
    - usestdlibvars
    - misspell
    - modernize
    - nlreturn
    - perfsprint
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (github.com/pterm/pterm.TablePrinter).Render
        - (github.com/pterm/pterm.TreePrinter).Render
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      # golangci-lint's default list, with ST1000 (package docs) turned on.
      checks: ["all", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    generated: lax
    # The "comments" preset is left out because it hides ST1000.
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go$
      - linters:
          - staticcheck
        path: (^|/)internal/
        text: ST1000
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
