name: REST residual benchmark (candidate)

on:
  push:
    branches:
      - perf/rest-residual-filter-reuse-20261019
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Residual reuse regression tests
        run: go test ./catalog/rest -run '^TestDecodeScanTasks(ReusesAdjacentResidualFilters|ResidualReuseDoesNotHideErrors)$' -count=1
      - name: Paired residual microbenchmarks
        run: go test ./catalog/rest -run '^$' -bench '^BenchmarkScanTaskResidualReuse$' -benchmem -benchtime=200ms -count=5
      - name: Full scan-task decoding benchmarks
        run: go test ./catalog/rest -run '^$' -bench '^BenchmarkDecodeScanTasksWithResiduals$' -benchmem -benchtime=200ms -count=5
